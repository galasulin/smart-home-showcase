# Home Front Command (Israel) alert choreography.
# Uses the community "Oref Alert" integration (HACS). mode: restart means a new
# alert during the countdown restarts the whole routine from the beginning.
alias: "Home Front Command — alert"
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.oref_alert
    to: "on"
actions:
  - action: input_datetime.set_datetime            # start time, for reports
    target: { entity_id: input_datetime.oref_alert_start }
    data: { datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}" }
  - action: counter.increment                      # weekly report reads this
    target: { entity_id: counter.oref_alerts_weekly }
  - action: switch.turn_on                         # light the path to the shelter
    target: { entity_id: [switch.kitchen_island_light, switch.shelter_room_light] }
  - action: cover.close_cover
    target: { entity_id: cover.all_shutters }
  - action: climate.turn_off
    target: { entity_id: climate.living_room_ac }
  - action: script.notify_household
    data:
      critical: true
      title: "⚠️ Go to the shelter now"
      message: >
        🚨 Home Front Command alert:
        {{ (state_attr('binary_sensor.oref_alert', 'selected_areas_active_alerts') or [])
           | map(attribute='data') | unique | list | join(', ') }}
        ⏳ ≈90 s to shelter · ⏰ {{ now().strftime('%H:%M:%S') }} · 🪟 shutters closing · 💡 lights on
  - action: tts.cloud_say
    target: { entity_id: media_player.living_room_speaker }
    data:
      language: he-IL
      message: "שים לב! יש התראת פיקוד העורף! היכנסו למרחב המוגן עכשיו!"
  - delay: { seconds: 10 }
  # Spoken countdown — nobody has to look at a phone.
  - repeat:
      for_each: ["30 שניות", "25 שניות", "20 שניות", "15 שניות", "10 שניות", "5 שניות"]
      sequence:
        - action: tts.cloud_say
          target: { entity_id: media_player.living_room_speaker }
          data: { language: he-IL, message: "{{ repeat.item }}" }
        - delay: { seconds: 5 }
